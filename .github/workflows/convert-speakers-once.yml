name: One-time speaker audio conversion
on:
  push:
    paths:
      - ".github/workflows/convert-speakers-once.yml"
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert MP3 files to mono 44.1 kHz 16-bit PCM WAV
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          for n in 1 2 3; do
            ffmpeg -y -i "Speaker ${n}.mp3" -map_metadata -1 -ac 1 -ar 44100 -c:a pcm_s16le "Speaker ${n}.wav"
          done
          for n in 1 2 3; do
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels,bits_per_sample -of default=noprint_wrappers=1 "Speaker ${n}.wav"
          done
      - name: Commit converted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Speaker 1.wav" "Speaker 2.wav" "Speaker 3.wav"
          git commit -m "Add PCM WAV versions of speech evaluation recordings"
          git push
